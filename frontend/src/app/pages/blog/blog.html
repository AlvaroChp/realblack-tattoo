<main>
  <h2>Blog</h2>
  <p>Noticias, novedades y artículos relacionados con el estudio y el mundo del tatuaje.</p>

  <section>
    @for (post of posts() | async; track post.id) {
      <article>
        <h3><a [routerLink]="['/blog', post.id]">{{ post.title }}</a></h3>
        <p>{{ post.summary }}</p>
        <p class="muted">{{ post.date }}</p>
        <a [routerLink]="['/blog', post.id]">Leer artículo</a>
      </article>
    } @empty {
      <p>Aún no hay publicaciones.</p>
    }
  </section>
</main>
