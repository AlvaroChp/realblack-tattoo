<main>
  @if (work(); as w) {
      <article>
        <h2>{{ w.title }}</h2>
        @if (w.image) {
          <img [src]="w.image" [alt]="w.title">
        }
        <p>{{ w.description }}</p>
        @if (artist(); as a) {
          <p>Artista: <a [routerLink]="['/artistas', a.id]">{{ a.name }}</a></p>
        }
        <a routerLink="/portfolio">Volver al portfolio</a>
      </article>
    } @else {
      <section>
        <h2>Trabajo no encontrado</h2>
        <a routerLink="/portfolio">Volver al portfolio</a>
      </section>
    }
</main>
