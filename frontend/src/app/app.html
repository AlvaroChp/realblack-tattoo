<div class="shell">
  <header>
    <div class="header-inner">
      <a class="brand" routerLink="/inicio" aria-label="RealBlack Tattoo - Inicio">
        <!-- Por ahora el logo es texto; más adelante: <img class="brand-logo" src="..." alt="RealBlack Tattoo"> -->
        <span class="brand-mark">RB</span>
        <span class="brand-name">REALBLACK<span class="brand-accent">TATTOO</span></span>
      </a>

      <nav aria-label="Navegación principal">
        <ul>
          <li><a routerLink="/inicio" routerLinkActive="active">Inicio</a></li>
          <li><a routerLink="/portfolio" routerLinkActive="active">Portfolio</a></li>
          <li><a routerLink="/artistas" routerLinkActive="active">Artistas</a></li>
          <li><a routerLink="/servicios" routerLinkActive="active">Servicios</a></li>
          <li><a routerLink="/contacto" routerLinkActive="active">Contacto</a></li>
          <li><a routerLink="/solicitar-cita" routerLinkActive="active" class="nav-cta">Reservar cita</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <router-outlet />

  <footer>
    <p>&copy; RealBlack Tattoo</p>
    <a routerLink="/aviso-legal">Aviso legal</a>
    <a routerLink="/privacidad">Política de privacidad</a>
    <a routerLink="/cookies">Política de cookies</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/admin">Panel de administración ({{ auth.user()?.username }})</a>
    } @else {
      <a routerLink="/admin/login">Acceso privado</a>
    }
  </footer>
</div>
