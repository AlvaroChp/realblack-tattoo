<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear artículo | Administración</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <header>
        <a href="../../index.html"><h1>REALBLACK TATTOO</h1></a>
        <a href="blog.html">Volver al blog</a>
    </header>

    <main>
        <h2>Crear artículo</h2>

        <form action="blog.html" method="get">
            <p>
                <label for="titulo">Título:</label><br>
                <input type="text" id="titulo" name="titulo" required>
            </p>

            <p>
                <label for="contenido">Contenido:</label><br>
                <textarea id="contenido" name="contenido" rows="10" required></textarea>
            </p>

            <p>
                <label for="imagen">Imagen (opcional):</label><br>
                <input type="file" id="imagen" name="imagen" accept="image/*">
            </p>

            <button type="submit">Guardar artículo</button>
        </form>
    </main>
</body>
</html>
