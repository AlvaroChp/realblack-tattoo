    <main>
        <h2>Gestionar vídeos</h2>
        <p>Desde esta sección se podrán gestionar los vídeos que se publiquen en la web.</p>

        <form action="videos.html" method="get">
            <p>
                <label for="titulo">Título del vídeo:</label><br>
                <input type="text" id="titulo" name="titulo" required>
            </p>

            <p>
                <label for="video">Seleccionar vídeo:</label><br>
                <input type="file" id="video" name="video" accept="video/*">
            </p>

            <button type="submit">Añadir vídeo</button>
        </form>

        <p>La subida y el almacenamiento de vídeos se implementarán posteriormente.</p>
    </main>

        <a href="panel.html">Volver al panel</a>
    </footer>
