<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Administración</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <header>
        <a href="../../index.html"><h1>REALBLACK TATTOO</h1></a>
        <h2>Zona de administración</h2>
    </header>

    <main>
        <h2>Iniciar sesión</h2>

        <form action="panel.html" method="get">
            <p>
                <label for="usuario">Usuario o correo electrónico:</label><br>
                <input type="text" id="usuario" name="usuario"
                       autocomplete="username" required>
            </p>

            <p>
                <label for="contrasena">Contraseña:</label><br>
                <input type="password" id="contrasena" name="contrasena"
                       autocomplete="current-password" required>
            </p>

            <button type="submit">Entrar</button>
        </form>

        <p>La autenticación real se implementará en el backend.</p>
    </main>

    <footer>
        <a href="../../index.html">Volver a la web pública</a>
    </footer>
</body>
</html>
